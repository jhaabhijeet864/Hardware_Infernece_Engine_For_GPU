name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
      custom_version:
        description: 'Custom version if bump_type is "custom" (e.g. 0.2.0 or 1.0.0)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (preview release notes without publishing or tagging)'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as a GitHub Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify code quality & tests
        run: |
          npm run lint
          npm run test

      - name: Build production bundle
        run: npm run build

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Version & Generate Release Notes (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_version
        run: |
          BUMP="${{ inputs.bump_type }}"
          if [ "$BUMP" = "custom" ] && [ -n "${{ inputs.custom_version }}" ]; then
            BUMP="${{ inputs.custom_version }}"
          fi

          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          node scripts/release-notes-generator.mjs \
            --bump "$BUMP" \
            $DRY_RUN_FLAG \
            --update-package \
            --write-changelog \
            --output release-notes.md \
            --output-version version.txt

          TARGET_VER=$(cat version.txt)
          echo "target_version=$TARGET_VER" >> $GITHUB_OUTPUT
          echo "target_tag=v$TARGET_VER" >> $GITHUB_OUTPUT

      - name: Generate Release Notes (Tag Push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: tag_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VER_NAME="${TAG_NAME#v}"
          node scripts/release-notes-generator.mjs \
            --bump "$VER_NAME" \
            --dry-run \
            --output release-notes.md \
            --output-version version.txt

          echo "target_version=$VER_NAME" >> $GITHUB_OUTPUT
          echo "target_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Append Release Notes to Step Summary
        run: |
          echo "### 📦 Generated Release Preview" >> $GITHUB_STEP_SUMMARY
          if [ -f release-notes.md ]; then
            cat release-notes.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop if Dry Run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          echo "Dry run completed successfully. Release was previewed and not published."
          exit 0

      - name: Commit version updates and tag (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          TAG="${{ steps.dispatch_version.outputs.target_tag }}"
          VER="${{ steps.dispatch_version.outputs.target_version }}"
          
          # Stage updated package.json and CHANGELOG.md if modified
          git add package.json CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No package.json or CHANGELOG.md changes to commit."
          else
            git commit -m "chore(release): release $TAG [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

          # Tag the release
          git tag -a "$TAG" -m "Hardware Inference Engine Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        if: "! (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.dispatch_version.outputs.target_tag || steps.tag_version.outputs.target_tag }}
          name: ${{ steps.dispatch_version.outputs.target_tag || steps.tag_version.outputs.target_tag }}
          body_path: release-notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            dist/*
