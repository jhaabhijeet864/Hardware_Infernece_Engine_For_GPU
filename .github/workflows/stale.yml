name: "Close Stale Issues and PRs"

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale Issue and PR Manager
    runs-on: ubuntu-latest
    steps:
      - name: Process stale issues and pull requests
        uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed within 7 days if no further activity occurs. Thank you for your contributions!'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had recent activity. It will be closed within 7 days if no further activity occurs. Thank you for your contributions!'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'pinned,security,roadmap,in-progress'
          exempt-pr-labels: 'pinned,in-progress,work-in-progress'
