name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  monorepo-build-and-test:
    name: Monorepo Lint, Test, and Build Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm --prefix packages/types run build
          npm --prefix packages/protocol run build
          npm --prefix packages/core run build
          npm --prefix packages/cli run build
          npm --prefix packages/api-client run build
          npm --prefix packages/ui run build
          npm --prefix apps/server run build

      - name: Run ESLint across monorepo
        run: npm run lint

      - name: Run package test suites
        run: |
          npm --prefix packages/core test
          npm --prefix packages/cli test
          npm test

      - name: Build Web Application
        run: npm run build
